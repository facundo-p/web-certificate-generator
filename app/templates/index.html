<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Certificate Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1><img src="{{ url_for('static', filename='images/logo-menu-bayka-nuevo.webp') }}"></h1>
        <form id="upload-form" enctype="multipart/form-data">
            <h1>Generador de Certificados PDF</h1>
            <div class="form-row">
                <label for="csv_file">Archivo CSV:</label>
                <input type="file" id="csv_file" name="csv_file" accept=".csv" required>
            </div>

            <div class="form-row">
                <label for="html_file">Template HTML:</label>
                <input type="file" id="html_file" name="html_file" accept=".html" required>
            </div>

            <div class="form-row">
                <label for="image_file">Imagen de Fondo:</label>
                <input type="file" id="image_file" name="image_file" accept=".jpeg,.jpg,.png" required>
            </div>

            <p class="note">Por favor subí los 3 archivos antes de generar los certificados.</p>
            <button id="generate-button" type="submit">Generar Certificados</button>
        </form>
        <div class="progress">
            <div class="progress-bar" id="bar"></div>
            <p id="status" class="note"></p>
            <a id="download" class="download-link" style="display:none; justify-content: center;" href="#">Descargar ZIP</a>
        </div>
    </div>


  <script>
    const form = document.getElementById('upload-form');
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');
    const download = document.getElementById('download');

    form.addEventListener('submit', async (e) => {
        const csvFile = document.getElementById('csv_file').files[0];
        const htmlFile = document.getElementById('html_file').files[0];
        const imageFile = document.getElementById('image_file').files[0];

        // Validate file types
        if (!csvFile || !csvFile.name.endsWith('.csv')) {
            alert('Please upload a valid CSV file.');
            return;
        }
        if (!htmlFile || !htmlFile.name.endsWith('.html')) {
            alert('Please upload a valid HTML file.');
            return;
        }
        if (!imageFile || !(imageFile.name.endsWith('.jpeg') || imageFile.name.endsWith('.jpg') || imageFile.name.endsWith('.png'))) {
            alert('Please upload a valid JPEG or PNG image file.');
            return;
        }

        e.preventDefault();
        download.style.display = 'none';
        status.textContent = 'Procesando...';
        bar.style.width = '10%';
        const data = new FormData(form);

        const res = await fetch('/generate', { method: 'POST', body: data });
        const { job_id } = await res.json();

        const source = new EventSource(`/stream/${job_id}`);
        source.onmessage = (event) => {
            const payload = JSON.parse(event.data);
            bar.style.width = `${payload.progress || 0}%`;
            status.textContent = payload.message;
            if (payload.download_url) {
                download.href = payload.download_url;
                download.style.display = 'flex';
                source.close();
            }
        };
    });
  </script>
</body>
</html>
